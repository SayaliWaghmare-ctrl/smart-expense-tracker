<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Smart Expense Tracker</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>

<body>

<div class="reset-container">

    <div class="reset-card">

        <!-- Icon -->
        <div class="icon-container">
            <i class="fa-solid fa-lock"></i>
        </div>

        <!-- Heading -->
        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new password for your account
        </p>

          <!-- Success Message -->
                <div th:if="${successMessage}"
                     class="alert success-alert" >

                    <span>✓</span>

                    <span th:text="${successMessage}">
                        User created successfully!
                    </span>
                </div>

                <!-- Error Message -->
                <div th:if="${errorMessage}"
                     class="alert error-alert">

                    <span>!</span>

                    <span th:text="${errorMessage}">
                        Something went wrong.
                    </span>
                </div>

        <!-- Reset Password Form -->
        <form th:action="@{/users/reset-password-form}"
              method="post"
              id="resetPasswordForm">

            <!-- Token received from email -->
            <input type="hidden"
                   name="token"
                   th:value="${token}">

            <!-- New Password -->
            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <div class="password-wrapper">

                    <i class="fa-solid fa-lock input-icon"></i>

                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           placeholder="Enter new password"
                           required
                           minlength="8">

                    <button type="button"
                            class="toggle-password"
                            onclick="togglePassword('newPassword', this)">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <!-- Password strength -->
                <div class="strength-container">

                    <div class="strength-bar">
                        <span id="strengthBar"></span>
                    </div>

                    <span id="strengthText">
                        Password strength
                    </span>

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <i class="fa-solid fa-shield-halved input-icon"></i>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Confirm new password"
                           required
                           minlength="8">

                    <button type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmPassword', this)">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

                <small id="matchMessage"></small>

            </div>


            <!-- Submit -->
            <button type="submit" class="reset-btn">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>

        </form>


        <!-- Back to login -->
        <div class="back-login">

            <a th:href="@{/login}">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Login
            </a>

        </div>

    </div>

</div>


<script>

    /* Show / Hide Password */

    function togglePassword(fieldId, button) {

        const field = document.getElementById(fieldId);
        const icon = button.querySelector("i");

        if (field.type === "password") {

            field.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            field.type = "newPassword";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }


    /* Password Strength */

    const password = document.getElementById("newPassword");
    const strengthBar = document.getElementById("strengthBar");
    const strengthText = document.getElementById("strengthText");

    password.addEventListener("input", function () {

        const value = password.value;

        let strength = 0;

        if (value.length >= 8)
            strength++;

        if (/[A-Z]/.test(value))
            strength++;

        if (/[0-9]/.test(value))
            strength++;

        if (/[^A-Za-z0-9]/.test(value))
            strength++;


        if (value.length === 0) {

            strengthBar.style.width = "0%";
            strengthText.textContent = "Password strength";

        }
        else if (strength <= 1) {

            strengthBar.style.width = "25%";
            strengthText.textContent = "Weak";

        }
        else if (strength === 2) {

            strengthBar.style.width = "50%";
            strengthText.textContent = "Medium";

        }
        else if (strength === 3) {

            strengthBar.style.width = "75%";
            strengthText.textContent = "Strong";

        }
        else {

            strengthBar.style.width = "100%";
            strengthText.textContent = "Very Strong";

        }

    });


    /* Confirm Password */

    const confirmPassword =
        document.getElementById("confirmPassword");

    const matchMessage =
        document.getElementById("matchMessage");


    confirmPassword.addEventListener("input", function () {

        if (confirmPassword.value === "") {

            matchMessage.textContent = "";

        }
        else if (newPassword.value === confirmPassword.value) {

            matchMessage.textContent = "Passwords match";
            matchMessage.className = "match-success";

        }
        else {

            matchMessage.textContent = "Passwords do not match";
            matchMessage.className = "match-error";

        }

    });

</script>

</body>
</html>
