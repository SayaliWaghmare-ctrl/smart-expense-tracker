<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User List | Smart Expense Tracker</title>
    
    <link rel="stylesheet" th:href="@{/css/user-list.css}">
</head>
<body>
<h1>Welcome to User List</h1>

                <!-- Success Message -->
                <div th:if="${successMessage}"
                     class="alert success-alert">

                    <span>✓</span>

                    <span th:text="${successMessage}">
                        User created successfully!
                    </span>

                </div>


                <!-- Error Message -->
                <div th:if="${errorMessage}"
                     class="alert error-alert">

                    <span>!</span>

                    <span th:text="${errorMessage}">
                        Something went wrong.
                    </span>

                </div>
                
<table border="1">
     <thead>
       <tr>
                <th>User ID</th>
                <th>User Name</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
               <!--  <th>Phone</th>
                <th>Actions</th> -->
       </tr>
     </thead>
     
     
    <tbody>
        
    <tr th:each="user : ${users}">
    <td th:text="${user.id}"></td>
    <td th:text="${user.username}"></td>
    <td th:text="${user.firstName}"></td>
     <td th:text="${user.lastName}"></td>
    <td th:text="${user.email}"></td>
  <!--   <td th:text="${user.phone}"></td> -->

    <td>
      
                     <!-- Edit -->
        <form th:action="@{/users/edit/{id}(id=${user.id})}"
               method="get"
               style="display:inline;">
               
          <button type="submit">
          
              Edit
          </button>     
            
        </form>

                   <!-- Delete -->
         <form th:action="@{/users/delete/{id}(id=${user.id})}"
              method="post"
              style="display:inline;">

            <button type="submit"
                    onclick="return confirm('Are you sure you want to delete this user?');">
                Delete
            </button>

        </form>
    </td>
</tr>
</tbody>
</table>

<a th:href="@{/users/login}"><button class="back-btn">Back to Login</button></a>

</body>
</html>
