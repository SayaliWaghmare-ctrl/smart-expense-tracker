<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> 
<head> <meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Login | Smart Expense Tracker</title> 
<link rel="stylesheet" th:href="@{/css/login.css}"> 
</head> 
<body> 
   <div class="login-container"> 
    <div class="login-card"> <h1>Smart Expense Tracker</h1> 
       <p class="subtitle">Login to manage your expenses</p> 
        <form th:action="@{/login}" method="post"> 
         <div class="form-group"> 
            <label for="email">User</label> 
               <input type="email" id="email" name="email" placeholder="Enter your email" required> 
         </div> 
         
         <div class="form-group"> 
           <label for="password">Password</label> 
             <input type="password" id="password" name="password" placeholder="Enter your password" required> 
         </div> 
         
         <button type="submit" class="login-btn"> Login </button> 
        </form> <p class="register-text"> Don't have an account? 
           <a th:href="@{/users/new}">Create User</a> 
                </p> </div> 
     </div> 
     
</body> 
</html>
