<!DOCTYPE html> <html lang="en" xmlns:th="http://www.thymeleaf.org"> 
<head> <meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Login | Smart Expense Tracker</title> 
<link rel="stylesheet" th:href="@{/css/login.css}"> 
</head> 
<body> 
   <div class="login-container"> 
    <div class="login-card"> <h1>Smart Expense Tracker</h1> 
       <p class="subtitle">Login to manage your expenses</p> 
       
          <!-- Success Message -->
                <div th:if="${successMessage}"
                     class="alert success-alert">

                    <span>✓</span>

                    <span th:text="${successMessage}">
                        User created successfully!
                    </span>

                </div>


                <!-- Error Message -->
                <div th:if="${errorMessage}"
                     class="alert error-alert">

                    <span th:text="${errorMessage}">
                        Something went wrong.
                    </span>
 
                     <span>!</span>
                </div>
                
        <form th:action="@{/getLogin}" method="post"> 
         <div class="form-group"> 
            <label for="username">User</label> 
               <input type="text" id="username" name="username" placeholder="Enter username" required> 
         </div> 
         
         <div class="form-group"> 
           <label for="password">Password</label> 
             <input type="password" id="password" name="password" placeholder="Enter your password" required> 
         </div> 
         
         <button type="submit" class="login-btn"> Login </button> 
        </form> <p class="register-text"> Don't have an account? 
           <a th:href="@{/users/new}">Create User</a> 
                </p> </div> 
     </div> 
     
</body> 
</html>
