<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Income</title>

    <!-- Font Awesome -->
<link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Category CSS -->
<link rel="stylesheet" th:href="@{/css/edit-income.css}">
</head>
<body>

<div class="category-form-container">

    <!-- Header -->
    <div class="form-header">

        <div>
            <h1>
                <i class="fa-solid fa-pen-to-square"></i>
                Update Income
            </h1>

            <p>
                Update the details of your income
            </p>
        </div>

        <a th:href="@{/income/incomeList}"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Income
        </a>

         <!-- Success Message -->
                <div th:if="${successMessage}"
                     class="alert success-alert">

                    <span>✓</span>

                    <span th:text="${successMessage}">
                        Income created successfully!
                    </span>

                </div>


                <!-- Error Message -->
                <div th:if="${errorMessage}"
                     class="alert error-alert">

                    <span>!</span>

                    <span th:text="${errorMessage}">
                        Something went wrong.
                    </span>

                </div>                
    </div>


    <!-- Form Card -->
    <div class="category-form-card">

        <form th:action="@{/income/updateIncome}"  th:object="${income}"  method="post">

            <!-- Hidden ID -->
            <input type="hidden"  th:field="*{id}">


                        <!-- Amount -->

            <div class="form-group">

                <label for="amount">
                    Amount
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-indian-rupee-sign"></i>

                    <input type="number"
                           id="amount"
                           th:field="*{amount}"
                           placeholder="Enter income amount"
                           step="0.01"
                           min="0.01"
                           required>
                </div>
            </div>


            <!-- Source -->

            <div class="form-group">

                <label for="source">
                    Source
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-building-columns"></i>

                    <input type="text"
                           id="source"
                           th:field="*{source}"
                           placeholder="e.g. Salary, Freelance, Bonus"
                           required>

                </div>

            </div>


            <!-- Category -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-layer-group"></i>

                    <select id="category"
                            th:field="*{category}"
                            required>

                        <option value="">
                            Select category
                        </option>

                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>
                </div>
            </div>


            <!-- Received Date -->

            <div class="form-group">

                <label for="date">
                    Received Date
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-calendar-days"></i>

                    <input type="date"
                           id="date"
                           th:field="*{date}"
                           required>
                </div>
            </div>


            <!-- Description -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <div class="input-wrapper textarea-wrapper">

                    <i class="fa-solid fa-align-left"></i>

                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Enter additional details (optional)"
                              rows="4">
                    </textarea>
                </div>
            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <a th:href="@{/home}"
                   class="cancel-btn">

                    <i class="fa-solid fa-xmark"></i>
                    Cancel

                </a>


                <button type="submit"
                        class="update-btn">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Update Income

                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
