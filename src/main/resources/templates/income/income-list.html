<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category List</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/income-list.css}">
</head>

<body>

<div class="category-container">

    <!-- Header -->
    <div class="category-header">

        <div>
            <h1>
                <i class="fa-solid fa-layer-group"></i>
                Income
            </h1>

            <p>Manage your expense and income categories</p>
        </div>

        <a th:href="@{/income/addIncome}" class="add-category-btn">
            <i class="fa-solid fa-plus"></i>
            Add Income
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert success-alert">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert error-alert">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${errorMessage}"></span>
    </div>
    
    
    <!-- Search Section -->
    <div class="category-tools">

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" id="categorySearch"
                   placeholder="Search income...">
        </div>
    </div>


    <!-- Category Table -->
    <div class="table-card">

        <table id="categoryTable">

            <thead>
            <tr>
                <th>#</th>
                <th>Amount</th>
                 <th>Received Date</th>
                <th>Description</th>
                <th>Source</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="income, status : ${incomeList}">

                <td th:text="${status.count}">
                    1
                </td>

                <td class="income-amount">
                    <div class="category-icon">
                        <i class="fa-solid fa-tag"></i>
                    </div>

                    <span th:text="${income.amount}">                       
                    </span>
                </td>

                 <td class="income-date"                  
                    th:text="${income.date}">                                                               
                 </td>
                
                <td class="description"
                    th:text="${income.description}">                   
                </td>

                 <td class="source"
                    th:text="${income.source}">                  
                </td>

                <td>
                    <div class="action-buttons">

                        <!-- Edit -->
                        <a th:href="@{/income/edit/{id}(id=${income.id})}"
                           class="edit-btn"
                           title="Edit Income">

                            <i class="fa-solid fa-pen"></i>
                        </a>

                        <!-- Delete -->
                        <form th:action="@{/income/delete/{id}(id=${income.id})}"
                              method="post"
                              class="delete-form"
                              onsubmit="return confirmDelete();">

                            <button type="submit"
                                    class="delete-btn"
                                    title="Delete Income">

                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>


            <!-- Empty State -->
            <tr th:if="${#lists.isEmpty(incomeList)}">

                <td colspan="5">

                    <div class="empty-state">

                        <i class="fa-solid fa-folder-open"></i>

                        <h3>No Income Found</h3>

                        <p>
                            You haven't created any income yet.
                        </p>

                        <a th:href="@{/income/addIncome}"
                           class="add-category-btn">

                            <i class="fa-solid fa-plus"></i>
                            Create Income
                        </a>
                    </div>
                </td>
              </tr>
            </tbody>
        </table>       
    </div>
    
     <a th:href="@{/home}"><button class="back-btn">Cancel</button></a>
     
  </div>


<script>

    /*
     * Search Categories
     */
    const searchInput = document.getElementById("categorySearch");

    searchInput.addEventListener("keyup", function () {

        const searchValue = this.value.toLowerCase();

        const rows = document.querySelectorAll("#categoryTable tbody tr");

        rows.forEach(function (row) {

            const amount = row.querySelector(".income-amount");
            const source = row.querySelector(".source");
            const date = row.querySelector(".income-date");

            if (!amount) {
                return;
            }

            const amountText = amount.textContent.toLowerCase();
            const dateText = date.textContent.toLowerCase();
            const sourceText = source.textContent.toLowerCase();

            if (amountText.includes(searchValue) || dateText.includes(searchValue) || 
                sourceText.includes(searchValue)) {
            	
                   row.style.display = "";
                   
            } else {
                row.style.display = "none";
            }

        });

    });


    /*
     * Delete Confirmation
     */
    function confirmDelete() {

        return confirm(
            "Are you sure you want to delete this category?"
        );

    }

</script>

</body>
</html>
